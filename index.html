<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIND YOUR PATH - اكتشف مسارك</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        deepBlack: '#050505',
                        darkCharcoal: '#111111',
                        luxGold: '#D9B56D',
                        neonCyan: '#00FFFF',
                        deepRed: '#C1121F',
                    }
                }
            }
        }
    </script>

    <style>
        /* Base & Scrollbar */
        body {
            background-color: #050505;
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(217, 181, 109, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 255, 255, 0.05), transparent 25%);
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #D9B56D; border-radius: 10px; border: 2px solid #050505; }
        ::-webkit-scrollbar-thumb:hover { background: #C1121F; }

        /* Glassmorphism Classes */
        .glass-panel {
            background: rgba(15, 15, 15, 0.6);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(217, 181, 109, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), inset 0 0 30px rgba(217, 181, 109, 0.05);
            border-radius: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .glass-panel::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.05), transparent);
            transform: skewX(-20deg);
            animation: shine 8s infinite alternate;
        }

        .glass-card {
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .glass-card:hover {
            background: rgba(217, 181, 109, 0.08);
            border-color: rgba(217, 181, 109, 0.4);
            transform: translateY(-5px) scale(1.01);
            box-shadow: 0 15px 35px rgba(217, 181, 109, 0.15);
        }

        .glass-card.selected {
            background: rgba(217, 181, 109, 0.15);
            border-color: #D9B56D;
            box-shadow: 0 0 25px rgba(217, 181, 109, 0.25) inset, 0 10px 30px rgba(217, 181, 109, 0.4);
            transform: scale(1.03);
        }

        /* Footer */
        .glass-footer {
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(217, 181, 109, 0.2);
            box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
        }

        /* Gradients & Text Glows */
        .text-glow-gold { text-shadow: 0 0 25px rgba(217, 181, 109, 0.7); }
        .text-glow-cyan { text-shadow: 0 0 25px rgba(0, 255, 255, 0.7); }
        .text-glow-red { text-shadow: 0 0 25px rgba(193, 18, 31, 0.7); }

        .bg-gradient-gold-red { background: linear-gradient(135deg, #D9B56D, #C1121F); }
        
        .text-gradient-gold {
            background: linear-gradient(to right, #D9B56D, #FFEDBA, #D9B56D);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientText 4s linear infinite;
        }

        /* Ambient Orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.25;
            animation: floatOrb 15s infinite ease-in-out alternate;
        }
        .orb-1 { width: 400px; height: 400px; background: #C1121F; top: -100px; right: -150px; }
        .orb-2 { width: 500px; height: 500px; background: #D9B56D; bottom: -200px; left: -100px; animation-delay: -5s; }
        .orb-3 { width: 300px; height: 300px; background: #00FFFF; top: 30%; left: 60%; opacity: 0.15; animation-delay: -10s; }

        /* Cinematic Animations */
        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }
        
        @keyframes gradientText {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(60px, -60px) scale(1.15); }
            100% { transform: translate(-30px, 80px) scale(0.9); }
        }

        /* Pulse Effects */
        .pulse-gold { animation: pulseGold 2s infinite cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes pulseGold {
            0% { box-shadow: 0 0 0 0 rgba(217, 181, 109, 0.8); }
            70% { box-shadow: 0 0 0 20px rgba(217, 181, 109, 0); }
            100% { box-shadow: 0 0 0 0 rgba(217, 181, 109, 0); }
        }
        
        .pulse-cyan { animation: pulseCyan 2s infinite cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes pulseCyan {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 255, 0.8); }
            70% { box-shadow: 0 0 0 20px rgba(0, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 255, 0); }
        }

        /* Reveal & Transitions */
        .reveal-up {
            animation: revealUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(40px);
        }
        @keyframes revealUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .scene-transition {
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .scene-out { opacity: 0; transform: scale(0.97) translateY(10px); }
        .scene-in { opacity: 1; transform: scale(1) translateY(0); }

        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }

        /* Cinematic Spinner */
        .cinematic-spinner {
            width: 100px;
            height: 100px;
            border: 3px solid rgba(217, 181, 109, 0.05);
            border-top-color: #D9B56D;
            border-bottom-color: #C1121F;
            border-left-color: #00FFFF;
            border-radius: 50%;
            animation: spinFast 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
            box-shadow: 0 0 30px rgba(217, 181, 109, 0.3);
        }
        @keyframes spinFast { 100% { transform: rotate(360deg); } }

        /* Floating Particles (CSS only) */
        .particle {
            position: absolute;
            background: #D9B56D;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            animation: particleFloat 8s infinite linear;
        }
        @keyframes particleFloat {
            0% { transform: translateY(0) scale(0); opacity: 0; }
            20% { opacity: 0.8; transform: scale(1); }
            80% { opacity: 0.5; }
            100% { transform: translateY(-100px) scale(0); opacity: 0; }
        }

        /* AI Scanner Effects */
        .scanner-laser {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: #00FFFF;
            box-shadow: 0 0 15px #00FFFF, 0 0 30px #00FFFF;
            animation: laserScan 2s ease-in-out infinite alternate;
            z-index: 10;
        }
        @keyframes laserScan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        /* Layout Structure */
        #main-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body class="antialiased selection:bg-luxGold selection:text-black">

    <!-- Ambient Background Effects -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    
    <!-- Particles Engine (CSS based simulation) -->
    <div id="particles-container" class="fixed inset-0 pointer-events-none z-0"></div>

    <!-- Main Content Area -->
    <div id="main-wrapper">
        <div id="app-container" class="w-full max-w-4xl scene-transition scene-in">
            <!-- Dynamic content injected here -->
        </div>
    </div>

    <!-- Elegant Footer / Watermark -->
    <footer class="glass-footer w-full py-5 px-4 text-center z-20 mt-auto">
        <div class="container mx-auto flex justify-center items-center gap-2 text-sm md:text-base font-semibold text-gray-300 flex-col md:flex-row">
            <div class="flex items-center gap-2">
                <span>&copy; 2026 جميع الحقوق محفوظة</span>
                <span class="text-neonCyan mx-2 hidden md:inline">|</span>
            </div>
            <div class="flex items-center gap-2">
                <span>إعداد</span>
                <span class="text-luxGold font-bold text-glow-gold tracking-wide text-lg">م. يوسف كريم عابد (بويكا)</span>
                <i class="fa-solid fa-crown text-luxGold ml-1 drop-shadow-[0_0_8px_rgba(217,181,109,0.8)]"></i>
            </div>
        </div>
    </footer>

    <!-- App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase Initialization ---
        let db, auth, currentUserId;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'find-your-path-app';

        async function initFirebase() {
            try {
                const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
                if (Object.keys(firebaseConfig).length > 0) {
                    const app = initializeApp(firebaseConfig);
                    db = getFirestore(app);
                    auth = getAuth(app);
                    
                    const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                    if (token) {
                        await signInWithCustomToken(auth, token).then(u => currentUserId = u.user.uid);
                    } else {
                        await signInAnonymously(auth).then(u => currentUserId = u.user.uid);
                    }
                }
            } catch(e) {
                console.error("Firebase init error:", e);
            }
        }
        initFirebase();

        window.saveUserData = async (data) => {
            if (!db || !currentUserId) return;
            try {
                // Rule 1 Strict Path for Follow List
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'registrations');
                await addDoc(colRef, {
                    ...data,
                    userId: currentUserId,
                    timestamp: new Date().toISOString()
                });
            } catch(e) { console.error("Error saving data", e); }
        }

        // --- Generate Particles ---
        function createParticles() {
            const container = document.getElementById('particles-container');
            for(let i = 0; i < 20; i++) {
                let particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.top = Math.random() * 100 + 'vh';
                particle.style.width = Math.random() * 4 + 1 + 'px';
                particle.style.height = particle.style.width;
                particle.style.animationDelay = (Math.random() * 8) + 's';
                particle.style.background = Math.random() > 0.5 ? '#D9B56D' : '#00FFFF';
                container.appendChild(particle);
            }
        }
        createParticles();

        // --- Data ---
        window.questionsData = [
            {
                question: "إيه المجال اللي مهتم تتعلمه؟",
                icon: "fa-compass",
                options: [
                    { id: 'web', text: "البرمجة وتطوير المواقع", icon: "fa-code" },
                    { id: 'marketing', text: "التسويق الرقمي والإعلانات", icon: "fa-bullhorn" },
                    { id: 'graphic', text: "الجرافيك ديزاين", icon: "fa-pen-nib" },
                    { id: 'video', text: "المونتاج وصناعة المحتوى", icon: "fa-video" },
                    { id: 'ai', text: "الذكاء الاصطناعي AI", icon: "fa-brain" },
                    { id: 'english', text: "اللغة الإنجليزية وتطوير الذات", icon: "fa-language" },
                    { id: 'undecided', text: "لسه مش عارف وعايز مساعدة", icon: "fa-question-circle" }
                ]
            },
            {
                question: "إيه مستواك الحالي؟",
                icon: "fa-layer-group",
                options: [
                    { id: 'beginner', text: "مبتدئ تمامًا", icon: "fa-seedling" },
                    { id: 'intermediate', text: "عندي معلومات بسيطة", icon: "fa-leaf" },
                    { id: 'advanced', text: "عندي خبرة وعايز أطور نفسي", icon: "fa-tree" }
                ]
            },
            {
                question: "إيه هدفك من التعلم؟",
                icon: "fa-bullseye",
                options: [
                    { id: 'cv', text: "تطوير مهاراتي وتقوية الـCV", icon: "fa-file-alt" },
                    { id: 'projects', text: "تنفيذ مشروعات عملية", icon: "fa-laptop-code" },
                    { id: 'job', text: "الاستعداد لسوق العمل", icon: "fa-briefcase" },
                    { id: 'income', text: "زيادة الدخل وتطوير شغلي", icon: "fa-chart-line" }
                ]
            },
            {
                question: "تقدر تخصص وقت قد إيه يوميًا للتعلم؟",
                icon: "fa-clock",
                options: [
                    { id: 'less_1', text: "أقل من ساعة", icon: "fa-hourglass-start" },
                    { id: '1_to_2', text: "من ساعة إلى ساعتين", icon: "fa-hourglass-half" },
                    { id: 'more_2', text: "أكثر من ساعتين", icon: "fa-hourglass-end" }
                ]
            },
            {
                question: "إيه الميزانية المناسبة ليك؟",
                icon: "fa-wallet",
                options: [
                    { id: 'free', text: "بدور على مصادر مجانية", icon: "fa-gift" },
                    { id: 'limited', text: "ميزانيتي محدودة", icon: "fa-coins" },
                    { id: 'paid', text: "مستعد أدفع مقابل محتوى تدريبي", icon: "fa-credit-card" }
                ]
            }
        ];

        // --- State ---
        window.state = {
            currentStep: 0,
            answers: {},
            whatsappStep: 1,
            userData: null,
            flow: null // 'path' or 'ticket'
        };

        const appContainer = document.getElementById('app-container');

        // --- Cinematic Transitions ---
        window.transitionTo = function(renderFunction) {
            appContainer.classList.remove('scene-in');
            appContainer.classList.add('scene-out');
            
            setTimeout(() => {
                renderFunction();
                appContainer.classList.remove('scene-out');
                void appContainer.offsetWidth; // Force reflow
                appContainer.classList.add('scene-in');
            }, 600);
        };

        // --- Screens ---

        window.renderRegister = function() {
            appContainer.innerHTML = `
                <div class="glass-panel p-8 md:p-12 max-w-lg mx-auto reveal-up shadow-[0_0_40px_rgba(217,181,109,0.15)]">
                    <div class="text-center mb-8">
                        <i class="fa-solid fa-user-astronaut text-luxGold text-5xl mb-4 text-glow-gold"></i>
                        <h2 class="text-3xl font-black text-white tracking-wide">تسجيل الدخول</h2>
                        <p class="text-gray-400 mt-2">يرجى إدخال بياناتك للمتابعة</p>
                    </div>
                    
                    <form id="register-form" onsubmit="event.preventDefault(); window.submitRegister();" class="space-y-5 text-right">
                        <div>
                            <label class="block text-gray-300 mb-2 font-bold">الاسم ثلاثي</label>
                            <input type="text" id="reg-name" required class="w-full bg-[#111111] border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-luxGold focus:ring-1 focus:ring-luxGold transition-all">
                        </div>
                        <div>
                            <label class="block text-gray-300 mb-2 font-bold">رقم التليفون</label>
                            <input type="tel" id="reg-phone" required class="w-full bg-[#111111] border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-luxGold focus:ring-1 focus:ring-luxGold transition-all">
                        </div>
                        <div>
                            <label class="block text-gray-300 mb-2 font-bold">اسم الشخص اللي دعاك</label>
                            <input type="text" id="reg-inviter" required class="w-full bg-[#111111] border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-luxGold focus:ring-1 focus:ring-luxGold transition-all">
                        </div>
                        <div>
                            <label class="block text-gray-300 mb-2 font-bold">بتدرس إيه؟</label>
                            <input type="text" id="reg-study" required class="w-full bg-[#111111] border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-luxGold focus:ring-1 focus:ring-luxGold transition-all">
                        </div>
                        <div>
                            <label class="block text-gray-300 mb-2 font-bold">المحافظة</label>
                            <select id="reg-gov" required class="w-full bg-[#111111] border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-luxGold focus:ring-1 focus:ring-luxGold transition-all appearance-none">
                                <option value="أسيوط">أسيوط</option>
                                <option value="القاهرة">القاهرة</option>
                                <option value="الإسكندرية">الإسكندرية</option>
                                <option value="سوهاج">سوهاج</option>
                                <option value="المنيا">المنيا</option>
                                <option value="أخرى">أخرى</option>
                            </select>
                        </div>
                        <button type="submit" class="w-full bg-gradient-gold-red pulse-gold text-white font-black py-4 rounded-xl mt-6 hover:scale-[1.02] transition-transform shadow-[0_5px_20px_rgba(193,18,31,0.4)] flex justify-center items-center gap-3 text-xl">
                            متابعة <i class="fa-solid fa-arrow-left"></i>
                        </button>
                    </form>
                </div>
            `;
        };

        window.submitRegister = async function() {
            const data = {
                fullName: document.getElementById('reg-name').value,
                phone: document.getElementById('reg-phone').value,
                inviter: document.getElementById('reg-inviter').value,
                study: document.getElementById('reg-study').value,
                governorate: document.getElementById('reg-gov').value
            };
            
            window.state.userData = data;
            
            // Save to Firebase asynchronously
            window.saveUserData(data);

            window.transitionTo(window.renderMainMenu);
        };

        window.renderMainMenu = function() {
            appContainer.innerHTML = `
                <div class="glass-panel p-10 md:p-16 text-center reveal-up max-w-2xl mx-auto">
                    <h2 class="text-3xl md:text-4xl font-black mb-4 text-white">أهلاً بك يا <span class="text-luxGold text-glow-gold drop-shadow-md">${window.state.userData.fullName}</span></h2>
                    <p class="text-gray-400 mb-10 text-lg">اختر وجهتك القادمة للبدء:</p>
                    
                    <div class="flex flex-col md:flex-row gap-6 justify-center">
                        <button onclick="window.startPathFlow()" class="flex-1 glass-card border-2 border-luxGold text-luxGold hover:bg-luxGold/10 font-black py-8 px-4 rounded-2xl transition-all duration-300 transform hover:-translate-y-2 group relative overflow-hidden">
                            <i class="fa-solid fa-compass text-5xl mb-4 block text-glow-gold group-hover:rotate-45 transition-transform duration-500"></i>
                            <span class="text-2xl block">اكتشف مسارك</span>
                            <span class="text-sm font-normal mt-2 block text-gray-400">تحليل تفاعلي لاختيار مجالك</span>
                        </button>
                        
                        <button onclick="window.startTicketFlow()" class="flex-1 bg-neonCyan text-black font-black py-8 px-4 rounded-2xl transition-all duration-300 transform hover:-translate-y-2 hover:bg-[#33ffff] shadow-[0_0_30px_rgba(0,255,255,0.4)] group relative overflow-hidden">
                            <i class="fa-solid fa-ticket text-5xl mb-4 block group-hover:scale-110 transition-transform duration-500"></i>
                            <span class="text-2xl block">احجز تيكت بريزنتيشن</span>
                            <span class="text-xl block mt-1 font-extrabold text-black/80">نقطة بداية</span>
                        </button>
                    </div>
                </div>
            `;
        };

        window.startPathFlow = function() {
            window.state.flow = 'path';
            window.transitionTo(window.renderHero);
        };

        window.startTicketFlow = function() {
            window.state.flow = 'ticket';
            window.transitionTo(window.renderTicketPayment);
        };

        window.renderHero = function() {
            appContainer.innerHTML = `
                <div class="glass-panel w-full p-10 md:p-20 text-center reveal-up">
                    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-gold-red"></div>
                    
                    <h2 class="text-luxGold font-bold tracking-widest text-xs md:text-sm mb-6 uppercase reveal-up delay-100">
                        <i class="fa-solid fa-film mr-2"></i> التجربة التفاعلية لاكتشاف الذات
                    </h2>
                    
                    <h1 class="text-5xl md:text-7xl lg:text-8xl font-black mb-8 leading-tight reveal-up delay-200">
                        FIND <br class="md:hidden"/> <span class="text-gradient-gold text-glow-gold">YOUR PATH</span>
                    </h1>
                    
                    <h3 class="text-2xl md:text-3xl font-bold mb-6 text-white reveal-up delay-300 drop-shadow-lg">
                        مش عارف تبدأ منين؟ إحنا هنساعدك.
                    </h3>
                    
                    <p class="text-gray-400 text-lg md:text-xl max-w-2xl mx-auto mb-12 leading-relaxed reveal-up delay-400">
                        رحلة سينمائية قصيرة من 5 أسئلة، تحلل اهتماماتك وتصمم لك خريطة طريق مخصصة.

                const isTicket = window.state.flow === 'ticket';
                btn.className = `w-full bg-transparent border-2 ${isTicket ? 'border-luxGold text-luxGold pulse-gold shadow-[0_0_30px_rgba(217,181,109,0.2)]' : 'border-neonCyan text-neonCyan pulse-cyan shadow-[0_0_30px_rgba(0,255,255,0.2)]'} font-black py-5 px-8 rounded-2xl transition-all duration-500 transform flex items-center justify-center gap-4 text-xl group overflow-hidden relative`;
                
                btnText.innerText = "تأكيد الإرسال للرقم البديل";
                btnIcon.className = "fa-solid fa-paper-plane text-2xl";
                
            } else if (window.state.whatsappStep === 2) {
                // Open second link
                window.open(window.waLink2, '_blank');
                window.state.whatsappStep = 3;
                
                // Disable button
                btn.className = "w-full bg-darkCharcoal border border-white/10 text-gray-500 font-black py-5 px-8 rounded-2xl transition-all duration-500 flex items-center justify-center gap-4 text-xl cursor-not-allowed";
                btn.disabled = true;
                
                btnText.innerText = "تم الإرسال بنجاح";
                btnIcon.className = "fa-solid fa-circle-check text-2xl text-green-500 drop-shadow-[0_0_10px_rgba(34,197,94,0.5)]";
            }
        };

        // --- Init ---
        window.onload = () => {
            window.transitionTo(window.renderRegister);
        };
    </script>
</body>
</html>
